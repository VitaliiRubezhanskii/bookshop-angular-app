<div [formGroup]="formGroup" class="credit-card-form">
  <h3 class="form-title">
    <svg class="card-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
    </svg>
    Credit Card Details
  </h3>

  <div class="form-grid">
    <!-- Card Type -->
    <div class="form-group">
      <label class="form-label">Card Type</label>
      <div class="select-wrapper">
        <select formControlName="cardType" class="form-select">
          <option value="">Select card type</option>
          <option value="visa">Visa</option>
          <option value="mastercard">Mastercard</option>
          <option value="amex">American Express</option>
          <option value="discover">Discover</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </div>
    </div>

    <!-- Name on Card -->
    <div class="form-group">
      <label class="form-label">Name on Card</label>
      <input type="text" formControlName="nameOnCard" class="form-input" placeholder="e.g. JOHN SMITH">
    </div>

    <!-- Card Number -->
    <div class="form-group">
      <label class="form-label">Card Number</label>
      <div class="card-number-input">
        <input type="text" formControlName="cardNumber" class="form-input" placeholder="1234 5678 9012 3456">
        <div class="card-icons">
          <img src="assets/visa.svg" class="card-brand" alt="Visa">
          <img src="assets/mastercard.svg" class="card-brand" alt="Mastercard">
          <img src="assets/amex.svg" class="card-brand" alt="American Express">
        </div>
      </div>
    </div>

    <!-- Security Code -->
    <div class="form-group">
      <label class="form-label">Security Code</label>
      <div class="security-code-wrapper">
        <input type="text" formControlName="securityCode" class="form-input" placeholder="CVV">
        <svg class="security-code-help" viewBox="0 0 20 20" fill="currentColor" title="3-digit code on back of card">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
        </svg>
      </div>
    </div>

    <!-- Expiration Month -->
    <div class="form-group">
      <label class="form-label">Expiration Month</label>
      <div class="select-wrapper">
        <select formControlName="expirationMonth" class="form-select">
          <option *ngFor="let month of months" [value]="month">{{ month }}</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </div>
    </div>

    <!-- Expiration Year -->
    <div class="form-group">
      <label class="form-label">Expiration Year</label>
      <div class="select-wrapper">
        <select formControlName="expirationYear" (change)="yearChanged.emit()" class="form-select">
          <option *ngFor="let year of years" [value]="year">{{ year }}</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </div>
    </div>
  </div>
</div>
