<div class="book-detail-container" *ngIf="product">
  <button class="back-button" (click)="goBack()">← Back</button>

  <div class="book-detail-card">
    <img [src]="product.imageUrl" alt="{{ product.name }}" class="book-cover" />

    <div class="book-info">
      <h2 class="book-title">{{ product.name }}</h2>
      <p class="book-description">{{ product.description }}</p>

      <div class="book-meta">
        <p class="book-price"><strong>Price:</strong> ${{ product.unitPrice }}</p>
        <p class="book-stock" [class.out-of-stock]="false">
          <strong>Status:</strong> {{ product.unitsInStock == 0 ? 'In Stock' : 'Out of Stock' }}
        </p>
      </div>

      <button
        class="add-to-cart-btn"
        [disabled]="product.unitsInStock == 0"
        (click)="addToCart()">
        Add to Cart
      </button>
    </div>
  </div>
</div>
